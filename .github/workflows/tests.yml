name: CPU reproducibility
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/reproduce_tape.py check
      - run: python -m pytest
      - run: python scripts/reproduce_tape.py replay --case all
